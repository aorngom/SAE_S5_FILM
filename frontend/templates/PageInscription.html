<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Moteur de Séries</title>
  <link rel="stylesheet" href="/static/css/PageInscription.css">
</head>
<body>

  <div class="background">
    <div class="overlay"></div>

    <div class="login-container">
      <h1 class="login-title">Créer un compte</h1>

      <form class="login-form" id="registerForm">

        <input type="text" id="identifiant" placeholder="Identifiant" required>
        <input type="email" id="email" placeholder="E-mail" required>

        <input type="text" id="prenom" placeholder="Prénom" required>
        <input type="text" id="nom" placeholder="Nom" required>

        <input type="text" id="adresse" placeholder="Adresse" required>
        <input type="text" id="telephone" placeholder="Téléphone" required>

        <input type="password" id="password" placeholder="Mot de passe" required>
        <input type="password" id="confirm" placeholder="Confirmer le mot de passe" required>

        <button type="submit" class="login-btn">S’inscrire</button>
      </form>

      <div class="help-links">
        <p>Déjà un compte ? <a href="/connexion">Connectez-vous</a></p>
      </div>

      <p id="registerMessage" class="message"></p>
    </div>
  </div>

  <script src="/static/js/inscription.js"></script>

</body>
</html>
